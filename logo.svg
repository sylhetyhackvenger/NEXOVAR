<svg width="380" height="360" viewBox="0 0 380 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Nexovar logo under attack</title>
<desc>The Nexovar hexagon shield with a lock inside is hit by incoming attack packets, the lock cracks and its shackle breaks, then the shield restores itself. Loops every 9 seconds.</desc>
<defs>
  <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#132033"/>
    <stop offset="100%" stop-color="#0a1420"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2dd4ef" stroke-opacity="0.07" stroke-width="1"/>
  </pattern>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity="0.12"/>
  </pattern>
  <radialGradient id="vignette" cx="50%" cy="42%" r="70%">
    <stop offset="0%" stop-color="#132033"/>
    <stop offset="100%" stop-color="#05080d"/>
  </radialGradient>
</defs>

<style>
  /* One 9s timeline drives everything:
     0-18% secure | 18-48% attack | 48-62% lock cracks | 62-75% breach | 75-100% restore */
  .a{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:linear}
  .fb{transform-box:fill-box}

  .hex,.inner,.trace,.corner{animation-name:cyc-hex}
  .node{animation-name:cyc-fill}
  .lock{animation-name:cyc-lock}
  .lockdot{animation-name:cyc-lockdot}

  .pkts{animation-name:cyc-pkts}
  .pkt{fill:#ff2d6f;opacity:0;animation:pkt 1s linear infinite}
  .trace{stroke-dasharray:5 4;animation:cyc-hex 9s linear infinite,flow 1.2s linear infinite}

  .core{animation-name:cyc-shake}
  .crack{stroke:#ff2d6f;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation-name:cyc-crack}
  .sh-l{transform-origin:0% 100%;animation-name:cyc-shl;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
  .sh-r{transform-origin:100% 100%;animation-name:cyc-shr;animation-timing-function:cubic-bezier(.2,.9,.3,1)}

  .shard{fill:#ff2d6f;opacity:0;animation-name:cyc-shard}
  .ring{fill:none;stroke-width:2;opacity:0;transform-origin:center}
  .ring.t{stroke:#ff2d6f;animation-name:cyc-ringt}
  .ring.c{stroke:#2dd4ef;animation-name:cyc-ringc}
  .flash{fill:#ff2d6f;opacity:0;animation-name:cyc-flash}

  .glitch{opacity:0;animation-name:cyc-glitch}
  .word{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:6px;font-size:34px;text-anchor:middle}
  .g1{fill:#ff2d6f;opacity:0;animation:gl1 .7s steps(1) infinite}
  .g2{fill:#2dd4ef;opacity:0;animation:gl2 .9s steps(1) infinite}

  .scanbox{opacity:0;animation-name:cyc-scan}
  .scanline{stroke:#ff2d6f;stroke-width:1.2;animation:scan 1.6s linear infinite}
  .sweep{fill:#2dd4ef;fill-opacity:.1;animation:sweep 5.5s linear infinite}

  .meter{transform-origin:0% 50%;animation-name:cyc-meter}
  .st{font-family:'Courier New',monospace;font-weight:700;font-size:12px;letter-spacing:3px;text-anchor:end;opacity:0}
  .st1{fill:#2dd4ef;animation-name:st1}
  .st2{fill:#ff2d6f;animation-name:st2}
  .st3{fill:#ff2d6f;animation-name:st3}
  .st4{fill:#ff2d6f;animation-name:st4}
  .st5{fill:#2dd4ef;animation-name:st5}

  @keyframes cyc-hex{0%,17%{stroke:#2dd4ef}20%,74%{stroke:#ff2d6f}78%,100%{stroke:#2dd4ef}}
  @keyframes cyc-fill{0%,17%{fill:#2dd4ef}20%,74%{fill:#ff2d6f}78%,100%{fill:#2dd4ef}}
  @keyframes cyc-lock{0%,47%{stroke:#eafcff}50%,74%{stroke:#ff2d6f}78%,100%{stroke:#eafcff}}
  @keyframes cyc-lockdot{0%,47%{fill:#2dd4ef}50%,74%{fill:#ff2d6f}78%,100%{fill:#2dd4ef}}

  @keyframes cyc-pkts{0%,17%{opacity:0}19%,61%{opacity:1}63%,100%{opacity:0}}
  @keyframes pkt{0%{transform:translateX(0);opacity:0}12%{opacity:1}82%{opacity:1}100%{transform:translateX(-92px);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-18}}

  @keyframes cyc-shake{
    0%,47%{transform:translate(0,0)}
    48%{transform:translate(-2px,1px)}49%{transform:translate(2px,-1px)}50%{transform:translate(-1px,-2px)}
    51%{transform:translate(2px,1px)}52%{transform:translate(-2px,0)}53%{transform:translate(1px,2px)}
    54%{transform:translate(-2px,-1px)}55%{transform:translate(2px,1px)}56%{transform:translate(-1px,2px)}
    57%{transform:translate(2px,-2px)}58%{transform:translate(-2px,1px)}59%{transform:translate(1px,-1px)}
    60%{transform:translate(-1px,1px)}61%,100%{transform:translate(0,0)}}
  @keyframes cyc-crack{
    0%,47%{opacity:0;stroke-dashoffset:1}
    48%{opacity:1;stroke-dashoffset:1}
    55%,74%{opacity:1;stroke-dashoffset:0}
    76%,100%{opacity:0;stroke-dashoffset:0}}
  @keyframes cyc-shl{
    0%,61%{transform:translate(0,0) rotate(0)}
    66%,76%{transform:translate(-34px,-34px) rotate(-62deg)}
    92%,100%{transform:translate(0,0) rotate(0)}}
  @keyframes cyc-shr{
    0%,61%{transform:translate(0,0) rotate(0)}
    66%,76%{transform:translate(36px,-40px) rotate(70deg)}
    92%,100%{transform:translate(0,0) rotate(0)}}

  @keyframes cyc-shard{
    0%,61%{opacity:0;transform:translate(0,0) rotate(0)}
    62%{opacity:1;transform:translate(0,0) rotate(0)}
    75%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
  @keyframes cyc-ringt{0%,61%{opacity:0;transform:scale(.3)}62%{opacity:.95;transform:scale(.3)}72%,100%{opacity:0;transform:scale(9)}}
  @keyframes cyc-ringc{0%,75%{opacity:0;transform:scale(.3)}76%{opacity:.95;transform:scale(.3)}90%,100%{opacity:0;transform:scale(9)}}
  @keyframes cyc-flash{0%,61%{opacity:0}62%{opacity:.55}69%,100%{opacity:0}}

  @keyframes cyc-glitch{0%,17%{opacity:0}19%,75%{opacity:1}77%,100%{opacity:0}}
  @keyframes gl1{0%{opacity:0}10%{opacity:.85;transform:translate(-4px,0)}14%{opacity:0}45%{opacity:.8;transform:translate(3px,-1px)}50%{opacity:0}80%{opacity:.7;transform:translate(-2px,1px)}85%{opacity:0}}
  @keyframes gl2{0%{opacity:0}22%{opacity:.8;transform:translate(4px,1px)}27%{opacity:0}60%{opacity:.75;transform:translate(-3px,0)}66%{opacity:0}}

  @keyframes cyc-scan{0%,17%{opacity:0}19%,47%{opacity:1}49%,100%{opacity:0}}
  @keyframes scan{0%{transform:translateY(-100px)}50%{transform:translateY(110px)}100%{transform:translateY(-100px)}}
  @keyframes sweep{from{transform:translateY(-90px)}to{transform:translateY(420px)}}

  @keyframes cyc-meter{
    0%,17%{transform:scaleX(.04)}
    35%{transform:scaleX(.68)}47%{transform:scaleX(.7)}
    55%{transform:scaleX(.94)}
    62%,74%{transform:scaleX(1)}
    90%,100%{transform:scaleX(.04)}}
  @keyframes st1{0%,17.5%{opacity:1}18%,99.5%{opacity:0}100%{opacity:1}}
  @keyframes st2{0%,17.5%{opacity:0}18%,47.5%{opacity:1}48%,100%{opacity:0}}
  @keyframes st3{0%,47.5%{opacity:0}48%,61.5%{opacity:1}62%,100%{opacity:0}}
  @keyframes st4{0%,61.5%{opacity:0}62%,74.5%{opacity:1}75%,100%{opacity:0}}
  @keyframes st5{0%,74.5%{opacity:0}75%,99.5%{opacity:1}100%{opacity:0}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .st1{opacity:1}
  }
</style>

<!-- background -->
<rect width="380" height="360" fill="url(#vignette)"/>
<rect width="380" height="360" fill="url(#grid)"/>
<rect class="sweep" x="0" y="0" width="380" height="40"/>

<!-- HUD corners -->
<g fill="none" stroke-width="2">
  <path class="a corner" d="M 10 28 L 10 10 L 28 10"/>
  <path class="a corner" d="M 352 10 L 370 10 L 370 28"/>
  <path class="a corner" d="M 10 332 L 10 350 L 28 350" transform="translate(0,-8)"/>
  <path class="a corner" d="M 370 324 L 370 342 L 352 342"/>
</g>

<!-- incoming attack packets -->
<g class="a pkts" transform="translate(190,140)">
  <g transform="rotate(0)"><rect class="pkt" x="188" y="-1" width="18" height="2" style="animation-delay:0s"/></g>
  <g transform="rotate(28)"><rect class="pkt" x="188" y="-1" width="14" height="2" style="animation-delay:.35s"/></g>
  <g transform="rotate(62)"><rect class="pkt" x="188" y="-1" width="18" height="2" style="animation-delay:.7s"/></g>
  <g transform="rotate(95)"><rect class="pkt" x="150" y="-1" width="14" height="2" style="animation-delay:.15s"/></g>
  <g transform="rotate(130)"><rect class="pkt" x="188" y="-1" width="18" height="2" style="animation-delay:.55s"/></g>
  <g transform="rotate(160)"><rect class="pkt" x="188" y="-1" width="14" height="2" style="animation-delay:.9s"/></g>
  <g transform="rotate(180)"><rect class="pkt" x="188" y="-1" width="18" height="2" style="animation-delay:.25s"/></g>
  <g transform="rotate(208)"><rect class="pkt" x="188" y="-1" width="14" height="2" style="animation-delay:.6s"/></g>
  <g transform="rotate(242)"><rect class="pkt" x="150" y="-1" width="18" height="2" style="animation-delay:.1s"/></g>
  <g transform="rotate(275)"><rect class="pkt" x="150" y="-1" width="14" height="2" style="animation-delay:.8s"/></g>
  <g transform="rotate(310)"><rect class="pkt" x="188" y="-1" width="18" height="2" style="animation-delay:.45s"/></g>
  <g transform="rotate(340)"><rect class="pkt" x="188" y="-1" width="14" height="2" style="animation-delay:.05s"/></g>
</g>

<!-- shield + lock -->
<g transform="translate(190,140)">
  <g class="a core">
    <polygon class="a hex" fill="url(#shieldFill)" stroke="#2dd4ef" stroke-width="2.2" points="0,-95 76,-55 76,38 0,105 -76,38 -76,-55"/>
    <polygon class="a inner" fill="none" stroke="#2dd4ef" stroke-width="0.6" opacity="0.5" points="0,-80 63,-45 63,32 0,88 -63,32 -63,-45"/>
    <path class="trace" stroke="#2dd4ef" stroke-width="1.2" fill="none" opacity="0.75" d="M -63 -45 L -30 -45 L -30 -20"/>
    <path class="trace" stroke="#2dd4ef" stroke-width="1.2" fill="none" opacity="0.75" d="M 63 -45 L 30 -45 L 30 -20"/>
    <path class="trace" stroke="#2dd4ef" stroke-width="1.2" fill="none" opacity="0.75" d="M -63 32 L -34 32 L -34 55"/>
    <path class="trace" stroke="#2dd4ef" stroke-width="1.2" fill="none" opacity="0.75" d="M 63 32 L 34 32 L 34 55"/>
    <path stroke="#4a90a8" stroke-width="1" fill="none" opacity="0.45" d="M 0 -80 L 0 -55"/>
    <path stroke="#4a90a8" stroke-width="1" fill="none" opacity="0.45" d="M 0 88 L 0 60"/>
    <circle class="a node" fill="#2dd4ef" cx="-30" cy="-45" r="3"/>
    <circle class="a node" fill="#2dd4ef" cx="30" cy="-45" r="3"/>
    <circle class="a node" fill="#2dd4ef" cx="-34" cy="55" r="3" opacity=".8"/>
    <circle class="a node" fill="#2dd4ef" cx="34" cy="55" r="3" opacity=".8"/>
    <circle class="a node" fill="#2dd4ef" cx="0" cy="-55" r="2.6" opacity=".8"/>

    <g transform="translate(0,2)">
      <rect class="a lock" fill="none" stroke="#eafcff" stroke-width="2.2" x="-18" y="-4" width="36" height="30" rx="4"/>
      <path class="a lock fb sh-l" fill="none" stroke="#eafcff" stroke-width="2.2" d="M -11 -4 L -11 -16 A 11 11 0 0 1 0 -27"/>
      <path class="a lock fb sh-r" fill="none" stroke="#eafcff" stroke-width="2.2" d="M 0 -27 A 11 11 0 0 1 11 -16 L 11 -4"/>
      <circle class="a lockdot" fill="#2dd4ef" cx="0" cy="10" r="3.5"/>
      <line class="a lock" stroke="#eafcff" x1="0" y1="13" x2="0" y2="20" stroke-width="2.2"/>
      <path class="a crack" pathLength="1" fill="none" stroke-width="1.6" d="M 4 -4 L -3 5 L 5 12 L -4 19 L 2 26"/>
    </g>

    <!-- breach effects -->
    <circle class="a ring t fb" cx="0" cy="12" r="12"/>
    <circle class="a ring c fb" cx="0" cy="12" r="12"/>
    <g transform="translate(0,2)">
      <polygon class="a shard" points="-4,-2 3,-4 1,3" style="--dx:-60px;--dy:-48px;--r:-200deg"/>
      <polygon class="a shard" points="-3,-3 4,-1 -1,4" style="--dx:62px;--dy:-52px;--r:240deg"/>
      <polygon class="a shard" points="-3,-2 3,-3 2,3" style="--dx:-72px;--dy:12px;--r:-140deg"/>
      <polygon class="a shard" points="-2,-3 4,0 -2,3" style="--dx:70px;--dy:20px;--r:180deg"/>
      <polygon class="a shard" points="-3,-2 2,-3 3,3" style="--dx:-30px;--dy:60px;--r:120deg"/>
      <polygon class="a shard" points="-3,-3 3,-1 -1,3" style="--dx:36px;--dy:62px;--r:-160deg"/>
      <polygon class="a shard" points="-2,-2 3,-2 0,3" style="--dx:4px;--dy:-74px;--r:300deg"/>
    </g>
  </g>
</g>

<!-- scanner beam -->
<g class="a scanbox"><line class="scanline" x1="0" x2="380" y1="140" y2="140"/></g>

<!-- wordmark with glitch layers -->
<g class="a glitch">
  <text class="word g1" x="190" y="275">NEXOVAR</text>
  <text class="word g2" x="190" y="275">NEXOVAR</text>
</g>
<text class="word" x="190" y="275" fill="#e7f6fa">NEXOVAR</text>
<text x="190" y="298" font-family="Arial,Helvetica,sans-serif" letter-spacing="4" fill="#a3c7d3" font-size="11" text-anchor="middle">CYBERSECURITY</text>

<!-- status line + threat meter -->
<rect x="20" y="326" width="170" height="4" fill="#2dd4ef" fill-opacity=".14"/>
<rect class="a meter fb" x="20" y="326" width="170" height="4" fill="#ff2d6f"/>
<g>
  <text class="a st st1" x="360" y="332">SECURE</text>
  <text class="a st st2" x="360" y="332">UNDER ATTACK</text>
  <text class="a st st3" x="360" y="332">LOCK FAILING</text>
  <text class="a st st4" x="360" y="332">BREACH</text>
  <text class="a st st5" x="360" y="332">RECOVERED</text>
</g>

<!-- scanlines on top, subtle -->
<rect width="380" height="360" fill="url(#scanlines)" pointer-events="none"/>
<!-- breach flash -->
<rect class="a flash" width="380" height="360" pointer-events="none"/>
</svg>
